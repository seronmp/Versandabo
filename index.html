<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet Spedizioni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #10b981;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-900: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .content {
            padding: 30px 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid var(--gray-200);
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-900);
            width: auto;
            margin-top: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            border-left: 4px solid;
        }

        .error {
            background: #fee2e2;
            color: var(--danger);
            border-color: var(--danger);
        }

        .success {
            background: #dcfce7;
            color: var(--success);
            border-color: var(--success);
        }

        .hidden {
            display: none;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .user-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .carnet-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .carnet-amount {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            margin-top: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .customer-list,
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .customer-item,
        .transaction-item {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 12px;
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .customer-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--gray-600);
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: var(--gray-600);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Carnet Spedizioni</h1>
            <p>Monitora le spedizioni</p>
        </div>

        <div class="content">
            <!-- LOGIN -->
            <div id="loginSection">
                <div id="message" class="message hidden"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="roleSelect">Accedi come</label>
                        <select id="roleSelect" required>
                            <option value="cliente">Cliente</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Accedi</button>
                </form>
            </div>

            <!-- CLIENT DASHBOARD -->
            <div id="clientSection" class="dashboard">
                <div class="user-badge" id="userCompany"></div>
                <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--gray-200);">
                    <small style="color: var(--gray-600);" id="userEmail"></small>
                </div>

                <div class="carnet-card">
                    <div>SALDO DISPONIBILE</div>
                    <div class="carnet-amount" id="saldo">€ 0,00</div>
                    <div style="font-size: 14px; opacity: 0.9;">
                        Totale: <strong id="totale">€ 0,00</strong>
                    </div>
                </div>

                <div class="section-title">Transazioni</div>
                <div id="clientTransactions" class="transaction-list">
                    <div class="loading">Caricamento...</div>
                </div>

                <button id="logoutBtn" class="btn btn-secondary">Esci</button>
            </div>

            <!-- ADMIN DASHBOARD -->
            <div id="adminSection" class="dashboard">
                <div class="user-badge">🔐 Admin</div>

                <div class="section-title">Clienti</div>
                <button id="btnNewCustomer" class="btn btn-primary" style="margin-bottom: 15px;">+ Nuovo Cliente</button>

                <div id="customersList" class="customer-list">
                    <div class="loading">Caricamento...</div>
                </div>

                <div class="section-title">Nuova Transazione</div>
                <button id="btnNewTx" class="btn btn-primary" style="margin-bottom: 15px;">+ Registra Spedizione</button>

                <div class="section-title">Storico</div>
                <div id="adminTransactions" class="transaction-list">
                    <div class="loading">Caricamento...</div>
                </div>

                <button id="adminLogoutBtn" class="btn btn-secondary">Esci</button>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="modalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:12px; padding:30px; max-width:400px; width:90%; box-shadow:0 20px 25px rgba(0,0,0,0.2);">
            <h3 id="modalTitle" style="margin-bottom:20px; font-size:18px;"></h3>
            <form id="modalForm"></form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // CONFIGURAZIONE
        const SUPABASE_URL = 'https://jocykxeqcrmbemaxjbnb.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvY3lreGVxY3JtYmVtYXhqYm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NDg0NTgsImV4cCI6MjEwNDQyNDQ1OH0.vFuY18hJg7eFCMEVP2Nh-NXfLcG_k1iGY1QxcuKBFKo';
        const ADMIN_EMAIL = 'leonardo@seron.one';

        // Inizializza Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DOM Elements
        const loginSection = document.getElementById('loginSection');
        const clientSection = document.getElementById('clientSection');
        const adminSection = document.getElementById('adminSection');
        const messageEl = document.getElementById('message');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminLogoutBtn = document.getElementById('adminLogoutBtn');

        let currentUser = null;
        let customers = [];

        // Show message
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.classList.remove('hidden');
            if (type === 'success') setTimeout(() => messageEl.classList.add('hidden'), 3000);
        }

        // Toggle sections
        function showSection(section) {
            loginSection.style.display = section === 'login' ? 'block' : 'none';
            clientSection.classList.toggle('active', section === 'client');
            adminSection.classList.toggle('active', section === 'admin');
        }

        // LOGIN
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('roleSelect').value;

            // Check if admin
            if (role === 'admin' && email !== ADMIN_EMAIL) {
                showMessage('Email admin non valida', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                currentUser = data.user;
                if (role === 'admin') {
                    showAdminDashboard();
                } else {
                    showClientDashboard();
                }
            } catch (err) {
                showMessage(err.message, 'error');
            }
        });

        // LOGOUT
        logoutBtn.addEventListener('click', logout);
        adminLogoutBtn.addEventListener('click', logout);

        async function logout() {
            await supabase.auth.signOut();
            showSection('login');
            loginForm.reset();
        }

        // CLIENT DASHBOARD
        async function showClientDashboard() {
            showSection('client');
            document.getElementById('userEmail').textContent = currentUser.email;

            const { data: customer } = await supabase
                .from('customers')
                .select('*')
                .eq('email', currentUser.email)
                .single();

            if (customer) {
                document.getElementById('userCompany').textContent = customer.company_name;
                document.getElementById('saldo').textContent = `€ ${customer.carnet_balance.toFixed(2).replace('.', ',')}`;
                document.getElementById('totale').textContent = `€ ${customer.carnet_total.toFixed(2).replace('.', ',')}`;

                const { data: txs } = await supabase
                    .from('carnet_transactions')
                    .select('*')
                    .eq('customer_id', customer.id)
                    .order('created_at', { ascending: false })
                    .limit(10);

                const txList = document.getElementById('clientTransactions');
                txList.innerHTML = '';
                if (txs && txs.length > 0) {
                    txs.forEach(tx => {
                        const date = new Date(tx.created_at).toLocaleDateString('it-IT');
                        txList.innerHTML += `
                            <div class="transaction-item">
                                <div style="font-weight:600;">${tx.description || 'Spedizione'}</div>
                                <div style="font-size:12px; color:var(--gray-600); margin-top:4px;">${date}</div>
                                <div style="color:var(--danger); font-weight:600; margin-top:4px;">-€ ${tx.amount.toFixed(2).replace('.', ',')}</div>
                            </div>
                        `;
                    });
                } else {
                    txList.innerHTML = '<div class="empty">Nessuna transazione</div>';
                }
            }
        }

        // ADMIN DASHBOARD
        async function showAdminDashboard() {
            showSection('admin');
            loadAdminData();
        }

        async function loadAdminData() {
            // Carica clienti
            const { data: custs } = await supabase.from('customers').select('*').order('created_at', { ascending: false });
            customers = custs || [];

            const custList = document.getElementById('customersList');
            custList.innerHTML = '';
            if (customers.length === 0) {
                custList.innerHTML = '<div class="empty">Nessun cliente</div>';
            } else {
                customers.forEach(c => {
                    custList.innerHTML += `
                        <div class="customer-item">
                            <div class="customer-header">
                                <div>${c.company_name}</div>
                                <div style="color:var(--primary); font-weight:600;">€ ${c.carnet_balance.toFixed(2).replace('.', ',')}</div>
                            </div>
                            <div style="font-size:12px; color:var(--gray-600); margin-bottom:8px;">${c.email}</div>
                            <div class="customer-actions">
                                <button class="btn btn-success btn-small" onclick="rechargeCustomer('${c.id}', '${c.company_name}')">Ricarica</button>
                                <button class="btn btn-primary btn-small" onclick="deleteCustomer('${c.id}')">Elimina</button>
                            </div>
                        </div>
                    `;
                });
            }

            // Carica transazioni
            const { data: txs } = await supabase
                .from('carnet_transactions')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(20);

            const txList = document.getElementById('adminTransactions');
            txList.innerHTML = '';
            if (!txs || txs.length === 0) {
                txList.innerHTML = '<div class="empty">Nessuna transazione</div>';
            } else {
                txs.forEach(tx => {
                    const cust = customers.find(c => c.id === tx.customer_id);
                    const date = new Date(tx.created_at).toLocaleDateString('it-IT');
                    txList.innerHTML += `
                        <div class="transaction-item">
                            <div style="font-weight:600;">${cust?.company_name || 'Sconosciuto'}</div>
                            <div style="font-size:12px; color:var(--gray-600); margin-top:4px;">${tx.description || 'Spedizione'} - ${date}</div>
                            <div style="color:var(--danger); font-weight:600; margin-top:4px;">-€ ${tx.amount.toFixed(2).replace('.', ',')}</div>
                        </div>
                    `;
                });
            }
        }

        // ADMIN ACTIONS
        document.getElementById('btnNewCustomer').addEventListener('click', () => {
            showModal('Nuovo Cliente', `
                <div class="form-group"><label>Email</label><input type="email" id="f_email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="f_password" required></div>
                <div class="form-group"><label>Azienda</label><input type="text" id="f_company" required></div>
                <div class="form-group"><label>Carnet (€)</label><input type="number" id="f_carnet" step="0.01" value="200" required></div>
                <button type="submit" class="btn btn-primary">Crea</button>
            `, async (form) => {
                const email = document.getElementById('f_email').value;
                const password = document.getElementById('f_password').value;
                const company = document.getElementById('f_company').value;
                const carnet = parseFloat(document.getElementById('f_carnet').value);

                try {
                    const { error: authErr } = await supabase.auth.admin.createUser({
                        email, password, email_confirm: true
                    });
                    if (authErr) throw authErr;

                    const { error: dbErr } = await supabase.from('customers').insert([{
                        email, company_name: company, carnet_total: carnet, carnet_balance: carnet
                    }]);
                    if (dbErr) throw dbErr;

                    showMessage('Cliente creato!', 'success');
                    closeModal();
                    loadAdminData();
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            });
        });

        document.getElementById('btnNewTx').addEventListener('click', () => {
            const opts = customers.map(c => `<option value="${c.id}">${c.company_name}</option>`).join('');
            showModal('Nuova Transazione', `
                <div class="form-group"><label>Cliente</label><select id="f_customer" required><option value="">-- Seleziona --</option>${opts}</select></div>
                <div class="form-group"><label>Importo (€)</label><input type="number" id="f_amount" step="0.01" required></div>
                <div class="form-group"><label>Descrizione</label><input type="text" id="f_desc" placeholder="es. Spedizione 001"></div>
                <button type="submit" class="btn btn-primary">Registra</button>
            `, async (form) => {
                const custId = document.getElementById('f_customer').value;
                const amount = parseFloat(document.getElementById('f_amount').value);
                const desc = document.getElementById('f_desc').value;

                try {
                    const { error: txErr } = await supabase.from('carnet_transactions').insert([{
                        customer_id: custId, amount, description: desc
                    }]);
                    if (txErr) throw txErr;

                    const { error: updErr } = await supabase
                        .from('customers')
                        .update({ carnet_balance: supabase.raw(`carnet_balance - ${amount}`) })
                        .eq('id', custId);
                    if (updErr) throw updErr;

                    showMessage('Transazione registrata!', 'success');
                    closeModal();
                    loadAdminData();
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            });
        });

        window.rechargeCustomer = (custId, name) => {
            showModal(`Ricarica: ${name}`, `
                <div class="form-group"><label>Importo (€)</label><input type="number" id="f_recharge" step="0.01" value="100" required></div>
                <button type="submit" class="btn btn-primary">Ricarica</button>
            `, async () => {
                const amt = parseFloat(document.getElementById('f_recharge').value);
                try {
                    const { error } = await supabase
                        .from('customers')
                        .update({
                            carnet_balance: supabase.raw(`carnet_balance + ${amt}`),
                            carnet_total: supabase.raw(`carnet_total + ${amt}`)
                        })
                        .eq('id', custId);
                    if (error) throw error;
                    showMessage('Carnet ricaricato!', 'success');
                    closeModal();
                    loadAdminData();
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            });
        };

        window.deleteCustomer = async (custId) => {
            if (!confirm('Sei sicuro?')) return;
            try {
                const { error } = await supabase.from('customers').delete().eq('id', custId);
                if (error) throw error;
                showMessage('Cliente eliminato', 'success');
                loadAdminData();
            } catch (err) {
                showMessage(err.message, 'error');
            }
        };

        // MODAL
        function showModal(title, html, onSubmit) {
            document.getElementById('modalTitle').textContent = title;
            const form = document.getElementById('modalForm');
            form.innerHTML = html;
            form.onsubmit = (e) => { e.preventDefault(); onSubmit(form); };
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        // Check auth on load
        window.addEventListener('load', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                if (user.email === ADMIN_EMAIL) {
                    showAdminDashboard();
                } else {
                    showClientDashboard();
                }
            }
        });

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') {
                showSection('login');
            }
        });
    </script>
</body>
</html>
